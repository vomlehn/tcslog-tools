[package]
name = "tcslog-tools"
version = "0.1.8"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vomlehn/tcslog-tools"
description = """\
Command-line tools for inspecting tcslog segment files: tcslog-dump and \
tcslog-dumphdr, part of the work on integrating tcslog with NASA's cFS \
and JPL's F Prime\
"""
readme = "README.md"
keywords = ["telemetry", "logging", "autonomous", "spacecraft", "drone"]
# Five is the most crates.io allows. The first two are what these are --
# command-line tools for looking at stored data when something went
# wrong -- and the rest are the vehicles the data comes off. aerospace
# and aerospace::drones are parent and child, which lists them under
# both. Not embedded: the library is, these run on the ground.
categories = [
    "command-line-utilities",
    "development-tools::debugging",
    "aerospace",
    "aerospace::drones",
    "science::robotics",
]

[dependencies]
clap = { version = "4", features = ["derive"] }

# Both tools only read. Turning off the default `write` feature keeps the
# library's build-time timer resolution out of the build, so these tools
# need no TIMER_RESOLUTION and no .cargo/config.toml.
#
# The path is a sibling checkout, used when both repositories are cloned
# side by side; `cargo publish` substitutes the registry version for it.
[dependencies.tcslog]
path = "../tcslog/tcslog"
version = "0.4"
default-features = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Each argument in a doc comment's # Arguments list continues in its
# description's column, as the TCS projects' documentation rule has it,
# which is deeper than this lint's two spaces.
doc_overindented_list_items = "allow"
