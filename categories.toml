# What each directory of tcslog-tools is, by the TCS code categories: see
# "Code categories" in tcs-helpers' README. A directory stands for
# everything under it but what a deeper path covers, and a file at the top
# is infrastructure. make operational-names holds this to the files git
# tracks, and to the names of the crates in each.

[categories]
# The programs that read a tcslog log once it is on the ground.
analysis-tools = [
	"src",
]

verification-tools = [
	"tests",
]

# What builds, documents and checks the rest.
infrastructure = [
	".cargo",
	".github",
	"bin",
	"docs",
	"packaging",
]
